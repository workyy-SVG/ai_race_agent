[server]
# 在 Streamlit Cloud 上保持默认 headless 模式即可
headless = true
# 如需更改端口（一般默认即可）
# port = 8501

[browser]
# 部署时通常不需要自动收集 telemetry
gatherUsageStats = false

# ==========================================================
# 深色金融主题（与 app.py 内 CUSTOM_CSS 色卡严格对齐）
#   主背景 #0F172A · 卡片 #111827 · 品牌主色 #614DFF(电光紫)
#   资本金 #D9A441 · 涨 #E63946 · 跌 #22C55E
#   文字 #F8FAFC / #CBD5E1 / #64748B
# 说明：theme 是 Streamlit 原生组件的底层变量（radio/input/
#       dataframe/selectbox 等都会读它）。必须设成深色，
#       否则自定义 CSS 与原生组件会「半深半浅」互相打架。
# ==========================================================
[theme]
base = "dark"
primaryColor = "#614DFF"              # 品牌主色：电光紫（按钮/高亮/AI 标识）
backgroundColor = "#0F172A"           # 主背景：深海军蓝（非纯黑，护眼）
secondaryBackgroundColor = "#111827"  # 卡片背景：比主背景亮一档，做出层次
textColor = "#F8FAFC"                 # 一级文字：纯白
font = "sans serif"

# 侧边栏单独加深，与主内容区形成左右分区
[theme.sidebar]
backgroundColor = "#0A1F44"
secondaryBackgroundColor = "#11224A"
